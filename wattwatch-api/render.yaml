# Render deployment config. When you connect this repo, Render reads this and
# sets the service up automatically. You still add the secret env vars
# (DB_PASSWORD, JWT_SECRET) in the Render dashboard.
services:
  - type: web
    name: wattwatch-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DB_SSL
        value: "true"
      - key: DB_PORT
        value: "3306"
      - key: CRM_API_URL
        value: "https://crm-backend-bj1l.onrender.com"
      # Firebase FCM v1: paste service account JSON into FIREBASE_SERVICE_ACCOUNT_JSON in Render dashboard
      # (Project settings → Service accounts → Generate new private key)
